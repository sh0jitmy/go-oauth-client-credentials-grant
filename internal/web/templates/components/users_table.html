{{define "users_table"}}
<div class="panel-card">
    <div class="panel-header">
        <h2>登録ユーザー一覧</h2>
        <span class="badge badge-subtle">{{len .Users}} 名</span>
    </div>
    <div class="table-responsive">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ユーザー名</th>
                    <th>ステータス</th>
                    <th>権限</th>
                </tr>
            </thead>
            <tbody>
                {{range .Users}}
                <tr>
                    <td><code>#{{.ID}}</code></td>
                    <td class="font-bold">{{.Username}}</td>
                    <td><span class="badge badge-success">ACTIVE</span></td>
                    <td><span class="badge badge-accent">User</span></td>
                </tr>
                {{else}}
                <tr>
                    <td colspan="4" class="text-center text-muted">ユーザーが見つかりません</td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>
{{end}}
