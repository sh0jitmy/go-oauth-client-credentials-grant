version: 2
project_name: go-oauth-client-credentials-grant

before:
  hooks:
    - go mod tidy

builds:
  - id: app
    binary: app
    main: ./cmd/app
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/shjtmy/go-oauth-client-credentials-grant/internal/version.Version={{.Version}}
      - -X github.com/shjtmy/go-oauth-client-credentials-grant/internal/version.Commit={{.Commit}}
      - -X github.com/shjtmy/go-oauth-client-credentials-grant/internal/version.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: web
    binary: web
    main: ./cmd/web
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/shjtmy/go-oauth-client-credentials-grant/internal/version.Version={{.Version}}
      - -X github.com/shjtmy/go-oauth-client-credentials-grant/internal/version.Commit={{.Commit}}
      - -X github.com/shjtmy/go-oauth-client-credentials-grant/internal/version.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: oauth-cli
    binary: oauth-cli
    main: ./cmd/oauth-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/shjtmy/go-oauth-client-credentials-grant/internal/version.Version={{.Version}}
      - -X github.com/shjtmy/go-oauth-client-credentials-grant/internal/version.Commit={{.Commit}}
      - -X github.com/shjtmy/go-oauth-client-credentials-grant/internal/version.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs?:'
      - '^test:'
